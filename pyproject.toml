[project]
name = "hasbiyallah-umutoniwabo-rl-summative"
version = "0.1.0"
description = "Adaptive digital-skills tutor: DQN, REINFORCE, PPO and A2C (TorchRL) on a custom Gymnasium environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    "pygame>=2.5",
    "torch>=2.5",
    "torchrl>=0.7",
    "tensordict>=0.7",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[tool.uv]
package = false